<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burger Club</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
<link rel="stylesheet" href="css/style.css?v=3">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <!-- Top bar -->
  <div id="topbar" class="hidden">
    <div class="topbar-left">
      <button id="menu-toggle" class="menu-toggle" aria-label="Open menu">☰</button>
      <div class="brand">
        <img src="logo.png" alt="Burger Club logo" class="brand-logo">
        <span class="brand-mark">BURGER CLUB</span>
        <span class="brand-sub">The Ledger</span>
      </div>
    </div>
    <div id="user-chip"></div>
  </div>

  <!-- Login screen -->
  <div id="login-screen">
    <div class="login-card">
      <img src="logo.png" alt="Burger Club logo" class="login-logo">
      <div class="brand-mark">BURGER CLUB</div>
      <p class="tag">Members only · ask the admin for a login</p>
      <form id="login-form">
        <div class="field">
          <label>Email</label>
          <input type="email" id="login-email" required autocomplete="username">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" style="width:100%;">Log in</button>
        <div class="error-msg" id="login-error"></div>
      </form>
    </div>
  </div>

  <!-- Main app -->
  <div id="app-shell" class="hidden">
    <div id="sidebar">
      <div id="sidebar-header">
        <h2>The Ledger</h2>
        <p>The quest for the best NYC burger starts here.</p>
        <button class="btn small hidden" id="add-entry-btn" style="margin-top:10px;width:100%;">+ Add a location</button>
        <button class="btn btn-blue small hidden" id="suggest-entry-btn" style="margin-top:10px;width:100%;">🔍 Suggest Club Meeting Location</button>
        <div class="sidebar-tabs">
          <button class="tab-btn active" id="tab-places">Places</button>
          <button class="tab-btn" id="tab-leaderboard">Leaderboard</button>
        </div>
      </div>
      <div id="filters-bar">
        <h4 class="filters-heading">🍟 Filter</h4>
        <div class="filters-row">
          <span class="filter-label">Added By:</span>
          <select id="filter-added-by" class="filter-select">
            <option value="">All members</option>
          </select>
        </div>
        <label class="filter-check"><input type="checkbox" id="filter-official"> ⭐ Official Meeting Locations</label>
        <label class="filter-check"><input type="checkbox" id="filter-suggested"> 🔵 Suggested Meeting Locations</label>
        <label class="filter-check"><input type="checkbox" id="filter-favorites"> ❤️ My favorites</label>
      </div>
      <div id="places-view">
        <div id="entry-list"></div>
        <div id="empty-state">No places added yet.</div>
      </div>
      <div id="leaderboard-view" class="hidden"></div>
    </div>
    <div id="sidebar-backdrop"></div>
    <div id="map"></div>
  </div>

  <!-- Modal panel (detail / add review / add entry) -->
  <div id="panel-overlay">
    <div class="panel-shell">
      <div class="panel" id="panel-body"></div>
      <img src="logo.png" alt="Official Burger Club location" id="official-stamp" class="official-stamp hidden" title="Official Burger Club location">
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
